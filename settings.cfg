# Usage
# Modify the PWM duty settings in this file, upload it to the ESP32 using WebREPL, and reboot the device.
# You can also download the current settings.cfg from your ESP32 at any time.
#
# Precedence
# If this file is present and valid, its settings will override those in main.py.
# If parsing fails, the program will fall back to the settings in main.py.
#
# Format
# Each line must follow the format: XX=YY
# - XX is the PWM duty cycle in percent (0 to 100)
# - YY is the temperature in degrees Celsius
# Use values that make sense for your specific sensor and cooling setup.
#
# Comments
# Lines starting with a hash (#) are considered comments and will be ignored.
#
# Examples
# 0=20  → When the highest temperature reading is 20°C or below, fans will not spin (PWM = 0%)
# 100=52 → When the temperature is 52°C or above, fans will run at full speed (PWM = 100%)
# Intermediate values are linearly interpolated.
# For example: if the temperature is 34°C, PWM will be 15% (interpolated between 10=30 and 20=38)
#
# Default settings:
0=20   
10=30
20=38
30=40
40=42
50=44
60=46
70=48
80=50
90=51
100=52
